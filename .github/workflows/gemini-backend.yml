name: Gemini Backend Engineering Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Engineering task for Gemini"
        required: true
        type: string
      scope:
        description: "Optional comma-separated paths/directories to prioritize"
        required: false
        default: "scripts,scenes,tests"
        type: string
      model:
        description: "Gemini API model"
        required: false
        default: "gemini-3.8-flash"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  gemini-engineer:
    name: Gemini repository engineer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Veyra Gemini Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Gemini engineering agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VEYRA_TASK: ${{ inputs.task }}
          VEYRA_SCOPE: ${{ inputs.scope }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY repository secret" && exit 1)
          python3 .github/gemini_agent.py

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: false

      - name: Validate changed project
        run: |
          godot --headless --path . --editor --quit
          timeout 12s godot --headless --path . --quit-after 4

      - name: Run Veyra core regression tests
        run: |
          godot --headless --path . --script tests/core_test.gd

      - name: Diff validation
        run: git diff --check

      - name: Create engineering branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          VEYRA_TASK: ${{ inputs.task }}
        run: |
          if git diff --quiet; then
            echo "Gemini made no repository changes."
            exit 0
          fi
          BRANCH="ai/gemini-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git add . ':!gemini_agent_output.json'
          git commit -m "AI: implement scoped Veyra engineering task"
          git push origin "$BRANCH"
          TITLE="AI: $VEYRA_TASK"
          TITLE="${TITLE:0:120}"
          gh pr create             --base main             --head "$BRANCH"             --title "$TITLE"             --body "Generated by the Veyra Gemini backend engineering agent. Task-scoped context was selected from the repository plus the compact architecture context. Godot import, smoke, regression, and diff validation completed. Human review remains required before merge."

      - name: Upload Gemini report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-engineering-report
          path: gemini_agent_output.json
          if-no-files-found: ignore
          retention-days: 7
